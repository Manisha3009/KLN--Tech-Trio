<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tech Trio Analytics{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">TT</span><div><strong>Tech Trio</strong><small>Student Analytics</small></div></div>
    <nav class="nav flex-column gap-1 mt-4">
      <a class="nav-link" href="{{ url_for('dashboard') }}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
      <a class="nav-link" href="{{ url_for('dashboard') }}#college-overview"><i class="bi bi-building"></i> College Analytics</a>
      <a class="nav-link" href="{{ url_for('dashboard') }}#search"><i class="bi bi-person-vcard"></i> Student Analytics</a>
      <a class="nav-link" href="{{ url_for('dashboard') }}#college-comparison"><i class="bi bi-collection"></i> Batch Analytics</a>
      <a class="nav-link" href="{{ url_for('dashboard') }}#college-overview"><i class="bi bi-person-badge"></i> Mentor Analytics</a>
      <a class="nav-link" href="{{ url_for('dashboard') }}#charts"><i class="bi bi-bar-chart"></i> Subject Analytics</a>
      <a class="nav-link" href="{{ url_for('dashboard') }}#charts"><i class="bi bi-graph-up-arrow"></i> Performance Analytics</a>
      <a class="nav-link" href="{{ url_for('dashboard', performance='Low') }}"><i class="bi bi-exclamation-triangle"></i> At-Risk Students</a>
    </nav>
  </aside>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
